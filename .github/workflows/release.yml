name: Release

on:
  push:
    tags:
      - 'v*'

# Serialize all release runs. Tags rarely arrive back-to-back, but when they
# do, two parallel publish jobs would race on npm and one would fail with
# "cannot publish over previously published version". The group key is a
# hardcoded literal (not `${{ github.workflow }}` or `release-${{ github.ref }}`)
# so different tags share a single queue and a future rename of the workflow
# `name:` field can't silently fragment the queue across the rename window.
# cancel-in-progress is false so a queued run waits its turn instead of being
# killed: losing a tag's release event is worse than waiting a minute.
concurrency:
  group: release-npm
  cancel-in-progress: false

jobs:
  integration:
    uses: ./.github/workflows/integration.yml
    secrets: inherit

  release:
    needs: integration
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Release
        run: bash release.sh
        env:
          CI: true
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Post-publish smoke test: the release is live on npm, so we confirm that
      # a fresh install via npx can execute the binary and respond to --version.
      # Catches packaging regressions (missing bin shebang, bad "files" entry,
      # broken esbuild output) before they hit real users.
      - name: Smoke test published package
        # Run npx from a temp dir — if run from the checkout root, npx sees our
        # own package.json `bin` entry and tries to resolve the local (unbuilt)
        # path instead of installing the published tarball.
        working-directory: ${{ runner.temp }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Registry propagation has two cache layers that desynchronize across
          # CDN edges: `npm view` reads metadata, `npx -y` fetches the tarball.
          # Seeing the version on one edge via `npm view` does not guarantee
          # the tarball is reachable from the edge `npx` hits a moment later --
          # observed ETARGET on v0.5.2 (2026-05-14) where npm view succeeded
          # immediately but the subsequent npx hit a stale edge. Retry the
          # whole smoke check, not just a metadata probe.
          LAST_ERR=""
          for i in 1 2 3 4 5 6; do
            if OUTPUT=$(npx -y "@yawlabs/postgres-mcp@${VERSION}" --version 2>&1); then
              if [ "$OUTPUT" = "$VERSION" ]; then
                echo "Smoke test passed on attempt $i: $OUTPUT"
                exit 0
              fi
              LAST_ERR="version mismatch: expected $VERSION, got $OUTPUT"
            else
              LAST_ERR="$OUTPUT"
            fi
            echo "Smoke attempt $i failed: $LAST_ERR"
            sleep 10
          done
          echo "Smoke test failed after 6 attempts. Last error: $LAST_ERR" >&2
          exit 1
